<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#FBFBFE"/>
  
  <!-- Subtle dotted grid background -->
  <defs>
    <pattern id="og-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#E7E7F0" />
    </pattern>
    <radialGradient id="og-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#EEF2FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FBFBFE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B3DB5"/>
      <stop offset="100%" stop-color="#7655D9"/>
    </linearGradient>
    <linearGradient id="og-mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7655D9"/>
      <stop offset="50%" stop-color="#8EA5FF"/>
      <stop offset="100%" stop-color="#05FFA1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-glow)"/>
  <rect width="1200" height="630" fill="url(#og-grid)"/>

  <!-- Decorative mesh sphere / card on right -->
  <g transform="translate(680, 115)">
    <rect width="440" height="400" rx="32" fill="#FFFFFF" stroke="#D6D1F3" stroke-width="2"/>
    <rect x="20" y="20" width="400" height="360" rx="24" fill="url(#og-mesh)"/>
    <!-- Floating point indicators -->
    <circle cx="120" cy="100" r="16" fill="#FFFFFF" fill-opacity="0.9" stroke="#7655D9" stroke-width="4"/>
    <circle cx="300" cy="180" r="16" fill="#FFFFFF" fill-opacity="0.9" stroke="#8EA5FF" stroke-width="4"/>
    <circle cx="200" cy="290" r="16" fill="#FFFFFF" fill-opacity="0.9" stroke="#5B3DB5" stroke-width="4"/>
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(90, 160)">
    <!-- Badge -->
    <rect width="210" height="36" rx="18" fill="#EEF2FF" stroke="#D6D1F3"/>
    <text x="24" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#7655D9">
      ✨ DESIGN TOOLS SUITE
    </text>

    <!-- Logo icon & title -->
    <g transform="translate(0, 60)">
      <rect width="56" height="56" rx="16" fill="url(#og-brand)"/>
      <text x="14" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">Ch</text>
      <text x="76" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="#17172A">
        Chroma<tspan fill="#7655D9">lab</tspan>
      </text>
    </g>

    <!-- Tagline -->
    <text x="0" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#17172A">
      Design, sem complicação.
    </text>
    
    <text x="0" y="245" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="500" fill="#62647A">
      Mesh Gradients, Paletas, Padrões, Texturas, Tipografia &amp; Glass Studio.
    </text>

    <!-- Subtitle pill -->
    <g transform="translate(0, 280)">
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#7655D9">
        100% Client-Side • WebGL GPU • Criado por Gabriel (@dev-gabs)
      </text>
    </g>
  </g>
</svg>
